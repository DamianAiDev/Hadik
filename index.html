<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia 3310 Had</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            touch-action: none; /* Úplne vypne gestá prehliadača, aby fungovali tlačidlá */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 10px;
        }
        
        #phone-body {
            background-color: #d3d9df;
            padding: 20px 15px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        #screen-container {
            background-color: #879A63; 
            border: 4px solid #4a5439; 
            border-radius: 10px;
            padding: 10px;
            position: relative;
        }

        canvas {
            background-color: transparent;
            display: block;
            margin: 0 auto;
            border: 1px solid #2b331f; 
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            color: #2b331f;
            font-size: 20px;
            margin-top: 5px;
        }

        /* OVLÁDANIE */
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
            padding: 10px;
        }

        .btn {
            background: #34495e;
            color: white;
            border: none;
            border-bottom: 5px solid #1a252f;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.05s;
        }

        .btn:active {
            transform: scale(0.9);
            background: #1abc9c;
            border-bottom-width: 0;
        }

        .up { grid-column: 2; }
        .left { grid-column: 1; }
        .down { grid-column: 2; }
        .right { grid-column: 3; }

        #start-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2b331f;
            font-size: 24px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="phone-body">
        <div id="screen-container">
            <div class="info-panel">
                <span>BODY: <span id="score">0</span></span>
                <span id="top-score-text">TOP: 0</span>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="start-msg">STLAČ ŠÍPKU<br>PRE ŠTART</div>
        </div>

        <div id="controls">
            <button class="btn up" id="btn-UP">▲</button>
            <button class="btn left" id="btn-LEFT">◀</button>
            <button class="btn down" id="btn-DOWN">▼</button>
            <button class="btn right" id="btn-RIGHT">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const startMsg = document.getElementById("start-msg");

        const gridSize = 20;
        const tileCount = 20;
        const PIXEL_COLOR = "#2b331f"; 

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0, dy = 0;
        let directionQueue = [];
        let score = 0;
        let isGameOver = false;
        let gameStarted = false;

        let topScore = localStorage.getItem("nokiaSnakeTopScore") || 0;
        document.getElementById("top-score-text").innerText = "TOP: " + topScore;

        // Funkcia pre vstup
        function handleInput(dir) {
            if (isGameOver) {
                resetGame();
                return;
            }

            if (!gameStarted) {
                gameStarted = true;
                startMsg.style.display = "none";
            }

            let lastDx = dx;
            let lastDy = dy;
            if (directionQueue.length > 0) {
                const last = directionQueue[directionQueue.length - 1];
                lastDx = last.dx;
                lastDy = last.dy;
            }

            if (dir === 'UP' && lastDy !== 1) directionQueue.push({dx: 0, dy: -1});
            if (dir === 'DOWN' && lastDy !== -1) directionQueue.push({dx: 0, dy: 1});
            if (dir === 'LEFT' && lastDx !== 1) directionQueue.push({dx: -1, dy: 0});
            if (dir === 'RIGHT' && lastDx !== -1) directionQueue.push({dx: 1, dy: 0});
            
            // Obmedzenie fronty, aby nebol lag
            if (directionQueue.length > 2) directionQueue.shift();
        }

        // Priradenie eventov tlačidlám (pointerdown je najrýchlejší pre mobil aj PC)
        document.getElementById('btn-UP').addEventListener('pointerdown', () => handleInput('UP'));
        document.getElementById('btn-DOWN').addEventListener('pointerdown', () => handleInput('DOWN'));
        document.getElementById('btn-LEFT').addEventListener('pointerdown', () => handleInput('LEFT'));
        document.getElementById('btn-RIGHT').addEventListener('pointerdown', () => handleInput('RIGHT'));

        // Klávesnica
        document.addEventListener('keydown', (e) => {
            const keys = { 38: 'UP', 40: 'DOWN', 37: 'LEFT', 39: 'RIGHT' };
            if (keys[e.keyCode]) {
                e.preventDefault();
                handleInput(keys[e.keyCode]);
            }
        });

        function main() {
            if (isGameOver) return;

            setTimeout(() => {
                update();
                draw();
                main();
            }, 150 - (Math.min(score / 20, 10) * 10)); // Postupné zrýchľovanie
        }

        function update() {
            if (!gameStarted) return;

            if (directionQueue.length > 0) {
                const next = directionQueue.shift();
                dx = next.dx;
                dy = next.dy;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Kolízia so stenou
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // Kolízia so sebou
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) return gameOver();
            }

            snake.unshift(head);

            // Jedlo
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Jedlo
            ctx.fillStyle = PIXEL_COLOR;
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            // Hadík
            snake.forEach((part, i) => {
                ctx.fillStyle = PIXEL_COLOR;
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                // Oči pre hlavu
                if (i === 0) {
                    ctx.fillStyle = "#879A63";
                    ctx.fillRect(part.x * gridSize + 4, part.y * gridSize + 4, 4, 4);
                    ctx.fillRect(part.x * gridSize + 12, part.y * gridSize + 4, 4, 4);
                }
            });
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function gameOver() {
            isGameOver = true;
            if (score > topScore) {
                topScore = score;
                localStorage.setItem("nokiaSnakeTopScore", topScore);
            }
            startMsg.innerHTML = "KONIEC!<br>ŤUKNI PRE REŠTART";
            startMsg.style.display = "block";
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0; dy = 0;
            score = 0;
            scoreEl.innerText = "0";
            isGameOver = false;
            gameStarted = false;
            directionQueue = [];
            startMsg.innerHTML = "STLAČ ŠÍPKU<br>PRE ŠTART";
            generateFood();
            main();
        }

        // Reštart po kliknutí na displej
        canvas.addEventListener('pointerdown', () => { if (isGameOver) resetGame(); });

        main();
    </script>
</body>
</html>
