<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia 3310 Had</title>
    <link rel="manifest" href="/Hadik/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/Hadik/sw.js');
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'VT323', monospace;
            margin-top: 30px;
        }
        
        #phone-body {
            background-color: #d3d9df;
            padding: 40px 30px 60px 30px;
            border-radius: 40px;
            box-shadow: inset 0px 0px 15px rgba(0,0,0,0.2), 5px 15px 30px rgba(0,0,0,0.5);
            border: 2px solid #b0b5ba;
        }

        #screen-container {
            background-color: #879A63; 
            border: 4px solid #4a5439; 
            border-radius: 10px;
            padding: 15px;
            box-shadow: inset 0px 0px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 404px;
        }

        canvas {
            background-color: transparent;
            display: block;
            margin: 0 auto;
            border: 2px solid #2b331f; 
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #2b331f;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #2b331f;
            padding-bottom: 5px;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            color: #2b331f;
            font-size: 22px;
            margin-top: 10px;
            margin-bottom: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="phone-body">
        <div id="screen-container">
            <h1><span>SKÓRE:</span> <span id="score">0</span></h1>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="info-panel">
                <span id="level-text">RÝCHLOSŤ: 1</span>
                <span id="top-score-text">TOP: 0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const PIXEL_COLOR = "#2b331f"; 

        // Herné premenné
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let directionQueue = []; 
        let score = 0;
        let foodsEaten = 0; 
        
        let baseSpeed = 250; 
        let currentSpeed = baseSpeed;
        let speedLevel = 1;
        
        let isGameOver = false;
        let isNewTopScore = false;

        // Načítanie najvyššieho skóre
        let topScore = localStorage.getItem("nokiaSnakeTopScore") || 0;
        document.getElementById("top-score-text").innerText = "TOP: " + topScore;

        document.addEventListener("keydown", handleKeyPress);

        function main() {
            if (hasGameEnded()) {
                isGameOver = true;
                
                // Kontrola a uloženie nového top skóre
                if (score > topScore) {
                    topScore = score;
                    localStorage.setItem("nokiaSnakeTopScore", topScore);
                    isNewTopScore = true;
                    document.getElementById("top-score-text").innerText = "TOP: " + topScore;
                } else {
                    isNewTopScore = false;
                }

                drawGameOverScreen();
                return; // Zastaví hernú slučku
            }

            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, currentSpeed);
        }

        function resetGame() {
            // Obnovenie premenných do pôvodného stavu
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            directionQueue = [];
            score = 0;
            foodsEaten = 0;
            currentSpeed = baseSpeed;
            speedLevel = 1;
            isGameOver = false;
            isNewTopScore = false;

            // Aktualizácia UI
            document.getElementById("score").innerHTML = score;
            document.getElementById("level-text").innerHTML = "RÝCHLOSŤ: " + speedLevel;
            
            generateFood();
            main(); // Znovu spustí hernú slučku
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = PIXEL_COLOR;
            snake.forEach((part, index) => {
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                if(index === 0) {
                    ctx.clearRect(part.x * gridSize + 5, part.y * gridSize + 5, gridSize - 10, gridSize - 10);
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = PIXEL_COLOR;
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
        }

        function advanceSnake() {
            if (directionQueue.length > 0) {
                const nextDirection = directionQueue.shift();
                dx = nextDirection.dx;
                dy = nextDirection.dy;
            }

            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                foodsEaten++;
                document.getElementById("score").innerHTML = score;
                
                if (foodsEaten % 5 === 0) increaseSpeed();
                generateFood();
            } else {
                snake.pop();
            }
        }

        function increaseSpeed() {
            if (currentSpeed > 60) {
                currentSpeed -= 25;
                speedLevel++;
                document.getElementById("level-text").innerHTML = "RÝCHLOSŤ: " + speedLevel;
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(function isFoodOnSnake(part) {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function handleKeyPress(event) {
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;
            const ENTER_KEY = 13;
            const SPACE_KEY = 32;
            const keyPressed = event.keyCode;

            // Zabránenie posunu okna
            if([32, 37, 38, 39, 40].indexOf(keyPressed) > -1) {
                event.preventDefault();
            }

            // Ak je koniec hry, čakáme na Enter alebo Medzerník
            if (isGameOver) {
                if (keyPressed === ENTER_KEY || keyPressed === SPACE_KEY) {
                    resetGame();
                }
                return;
            }

            let lastDx = dx;
            let lastDy = dy;
            if (directionQueue.length > 0) {
                lastDx = directionQueue[directionQueue.length - 1].dx;
                lastDy = directionQueue[directionQueue.length - 1].dy;
            }

            if (keyPressed === LEFT_KEY && lastDx !== 1) {
                directionQueue.push({dx: -1, dy: 0});
            } else if (keyPressed === UP_KEY && lastDy !== 1) {
                directionQueue.push({dx: 0, dy: -1});
            } else if (keyPressed === RIGHT_KEY && lastDx !== -1) {
                directionQueue.push({dx: 1, dy: 0});
            } else if (keyPressed === DOWN_KEY && lastDy !== -1) {
                directionQueue.push({dx: 0, dy: 1});
            }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function drawGameOverScreen() {
            // Polopriehľadné pozadie prekryje hru
            ctx.fillStyle = "rgba(135, 154, 99, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = PIXEL_COLOR;
            ctx.textAlign = "center";
            
            // Text GAME OVER
            ctx.font = "bold 45px 'VT323', monospace";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);
            
            // Skóre
            ctx.font = "28px 'VT323', monospace";
            ctx.fillText("SKÓRE: " + score, canvas.width / 2, canvas.height / 2 - 5);
            ctx.fillText("TOP SKÓRE: " + topScore, canvas.width / 2, canvas.height / 2 + 25);
            
            // Nový rekord
            if (isNewTopScore) {
                ctx.fillText("🎉 NOVÝ REKORD! 🎉", canvas.width / 2, canvas.height / 2 + 65);
            }
            
            // Inštrukcia pre reštart
            ctx.font = "22px 'VT323', monospace";
            ctx.fillText("> STLAČ ENTER PRE NOVÚ HRU <", canvas.width / 2, canvas.height / 2 + 110);
        }

        // Štart prvej hry
        main();
    </script>
</body>
</html>
